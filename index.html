<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Use Case Risk Scorecard</title>
<style>
  * { box-sizing: border-box }
  :root { --ink: #17263c; --muted: #4e6177; --teal: #00776d; --line: #d9e3ec; --paper: #fff }
  body { margin: 0; background: #eaf0f5; color: var(--ink); font: 14px/1.25 Arial, sans-serif }
  main { display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 12px; height: 100dvh; padding: 0 14px 12px }
  .masthead { display: flex; align-items: center; gap: 13px; min-width: 0; margin: 0 -14px;
    padding: 14px 24px; color: white; background: linear-gradient(110deg,#101c2e 15%,#203854 73%,#16484d);
    border-bottom: 2px solid #4fc0af; box-shadow: 0 5px 18px #152c4429 }
  .mark { display:grid; place-items:center; flex:0 0 38px; width:38px; height:38px; border-radius:10px;
    border:1px solid #7fd6c994; background:#2a62686b; color:#b7f8ed; font-size:19px; font-weight:700 }
  .project { color: #b1ddd9; font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase }
  .masthead h1 { margin: 3px 0 0; font-size: clamp(17px, 2.25vw, 23px); line-height: 1.12 }
  .masthead-title { display: flex; align-items: center; gap: 13px }
  .credits { margin: 7px 0 0; color: #fff; font-size: 14px; line-height: 1.4 }
  .credits strong { color: #b7f8ed; margin-right: 4px }
  .workspace { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line);
    border-radius: 12px; background: var(--paper); box-shadow: 0 8px 23px #223b5013 }
  #sheet, nav { overflow: auto; scrollbar-color: #8da5b5 #eff4f8 }
  #sheet { height: 100%; scrollbar-gutter: stable; overscroll-behavior: contain }
  #pane-divider { position: absolute; z-index: 10; top: 0; width: 11px; margin-left: -5px;
    cursor: move; touch-action: none; background: linear-gradient(90deg, transparent 4px, #7897a9 4px 7px, transparent 7px) }
  #pane-divider::after { content:''; position:absolute; top:50%; left:50%; width:13px; height:30px;
    transform:translate(-50%,-50%); border:1px solid #587e8d; border-radius:7px; pointer-events:none;
    background: radial-gradient(circle,#526d7e 1px,transparent 1.6px) center / 5px 5px, #eef5f7 }
  #pane-divider:hover, #pane-divider:focus-visible, #pane-divider.dragging {
    background: linear-gradient(90deg, transparent 4px, var(--teal) 4px 7px, transparent 7px) }
  nav { display: flex; min-width: 0; background: #f7fafc; border: 1px solid var(--line);
    border-radius: 11px; padding: 6px; gap: 4px; box-shadow: 0 3px 10px #223b5010 }
  button { flex-shrink: 0; white-space: nowrap; padding: 8px 13px; border: 1px solid transparent; border-radius: 7px;
    color: var(--muted); background: transparent; font: inherit; font-weight: 600; cursor: pointer }
  button:hover { color: var(--ink); background: #eaf1f6 }
  button[aria-selected=true] { border-color: #b2ddd4; background: #e1f6f1; color: #065c53; box-shadow: inset 0 -2px #168a7c }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: -2px }
  table { table-layout: fixed; border-spacing: 0; empty-cells: show }
  th, td { padding: 2px 4px; overflow-wrap: anywhere; background: white }
  th { background: #eff4f8; color: var(--muted); font-weight: normal; border: 1px solid #e1e9ef }
  td { white-space: pre-wrap; vertical-align: bottom }
  .grid td { border-right: 1px solid #e4ebf1; border-bottom: 1px solid #e4ebf1 }
  .pinned { position: sticky; z-index: 2 }
  .pinned.both { z-index: 3 }
  .freeze-bottom { box-shadow: inset 0 -3px #8fa8b9 }
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere }
  .sticky-note { position: sticky }
  .scorecard td { padding: 1px 2px }
  .scorecard th { border: 0; background: #eff4f8 }
  .scorecard tr:nth-child(even):nth-child(n+6) td { background: #f6f9fc }
  .risk-result { display:inline-block; max-width:100%; padding: 4px 7px; border-radius: 6px;
    border:1px solid #c6dedb; background:#eaf5f2; color:#135b54; font-weight:700 }
  .risk-result.high, .risk-result.hold { border-color:#ecd6a0; background:#fff5db; color:#714500 }
  .risk-result.critical, .risk-result.stop { border-color:#ebbac0; background:#fff0f1; color:#94293b }
  .scorecard tr:first-child td, .scorecard tr:first-child th { padding: 0; }
  .scorecard tr:first-child div { min-height: 0 }
  a { color: inherit }
  a:hover { text-decoration-thickness: 2px }
  td:focus-within, td:target { outline: 2px solid var(--teal); outline-offset: -2px }
  .choice { position: relative; width: 100%; padding-right: 13px }
  .choice::after { content: '▾'; position: absolute; right: 3px; top: 50%; transform: translateY(-50%); color: #806a16; pointer-events: none }
  .choice select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer }
  @media (max-width: 600px) {
    main { gap: 7px; padding: 0 6px 6px }
    .masthead { margin: 0 -6px; padding: 9px 12px }
    .workspace, nav { border-radius: 8px }
  }
</style>
<main>
  <header class="masthead">
    <div class="masthead-title">
      <span class="mark" aria-hidden="true">F</span>
      <div>
        <div class="project">Forge Chicago LEAD</div>
        <h1>AI Use Case Risk Scorecard</h1>
        <p class="credits"><strong>Produced by:</strong> Chidambara Raja G, Sabrina Arshad, Hafsa Nauman, Mustafa Hasan, and Lailoma Nabizada</p>
      </div>
    </div>
  </header>
  <section class="workspace" aria-label="Workbook">
    <div id="sheet" tabindex="0" aria-label="Worksheet">Loading scorecard…</div>
    <div id="pane-divider" role="separator" aria-orientation="vertical" aria-label="Drag or use arrow keys to scroll the worksheet" tabindex="0" hidden></div>
  </section>
  <nav role="tablist" aria-label="Worksheets"></nav>
</main>

<script>

const index = letters => [...letters].reduce((sum, letter) => sum * 26 + letter.charCodeAt(0) - 64, 0);

function range(ref) {

    table.className = [sheet.grid ? 'grid' : '', scorecard ? 'scorecard' : ''].join(' ');
    const widths = [scorecard ? 10 : 34, ...sheet.widths.map(w => Math.floor(w * 6))];
    const heights = [scorecard ? 0 : 22, ...sheet.heights];
    if (scorecard && Object.entries(sheet.cells).every(([address, cell]) => !/^[A-Z]+1$/.test(address) || cell[0] === null)) {
      heights[1] = 2;
    }
    const [, freezeCol, freezeRow] = /^([A-Z]+)(\d+)$/.exec(sheet.freeze || 'A1');
    const frozenX = index(freezeCol), frozenY = +freezeRow;
    const prefix = (sizes, n) => sizes.slice(0, n).reduce((a, b) => a + b, 0);
    if (sheet.widths.length <= 6 || name === 'Rubric') {
      const minimumWidth = name === 'Rubric' ? 990 : 660;
      const available = Math.max(minimumWidth, sheetView.clientWidth) - widths[0];
      const ratio = Math.min(1, available / (prefix(widths, widths.length) - widths[0]));
      for (let c = 1; c < widths.length; c++) widths[c] = Math.floor(widths[c] * ratio);
    }
    const frozenWidth = prefix(widths, frozenX);
    const maxFrozenWidth = Math.max(widths[0], Math.floor(sheetView.clientWidth * 0.55));
    if (frozenWidth > maxFrozenWidth) {
      const ratio = (maxFrozenWidth - widths[0]) / (frozenWidth - widths[0]);
      for (let c = 1; c < frozenX; c++) widths[c] = Math.max(1, Math.floor(widths[c] * ratio));
    }
    const columnGroup = el('colgroup');
    table.style.width = prefix(widths, widths.length) + 'px';
    for (const width of widths) {
      const col = el('col');
      col.style.width = width + 'px';
      columnGroup.append(col);
    }
    table.append(columnGroup);
    const mergeStarts = new Map(), covered = new Set();
    for (const area of sheet.merges) {
      const rows = range(area), origin = rows[0][0];
      mergeStarts.set(origin, [rows.length, rows[0].length]);
      for (const cell of rows.flat()) if (cell !== origin) covered.add(cell);
    }
    // An unwrapped workbook label can extend through adjacent empty cells.
    // Give that text real layout space so increasing the type can grow the row.
    const notes = new Set();
    for (let r = 1; r < heights.length; r++) {
      for (let c = 1; c < widths.length; c++) {
        const address = column(c) + r;
        const [text, style, formula, , , wraps] = sheet.cells[address];
        if (typeof text !== 'string' || !text || formula || wraps || covered.has(address) ||
            mergeStarts.has(address) || sheet.validations[address] ||
            (c !== 1 && !(name === 'Rubric' && address === 'H4'))) continue;
        let end = c + 1;
        while (end < widths.length) {
          const next = column(end) + r;
          const [value, otherStyle, otherFormula, , comment] = sheet.cells[next];
          if (value !== null || otherFormula || comment || covered.has(next) || mergeStarts.has(next) ||
              sheet.validations[next] || (style !== otherStyle && book.styles[otherStyle].includes('background-color:'))) break;
          end++;
        }
        if (end === c + 1) continue;
        notes.add(address);
        mergeStarts.set(address, [1, end - c]);
        for (let blank = c + 1; blank < end; blank++) covered.add(column(blank) + r);
      }
    }
    const conditional = sheet.conditional.map(([area, ...rule]) => [new Set(range(area).flat()), ...rule]);
    function currentValue(address) {
      try { return read(name, address); } catch (error) { return error.message; }
    }
    const updates = [];
    function edit(entry, value) {
      entry[0] = value;
      read = calculate(book);
      for (const update of updates) update();
    }
    for (let r = scorecard ? 1 : 0; r < heights.length; r++) {
      const row = table.insertRow();
      row.style.height = heights[r] + 'px';
      for (let c = 0; c < widths.length; c++) {
        const addr = column(c) + r;
        if (covered.has(addr)) continue;
        const cell = el(r && c ? 'td' : 'th');
        if (r && c) {
          const entry = sheet.cells[addr], [saved, style, ast, fmt, note] = entry;
          cell.style.cssText = book.styles[style];
          if (scorecard && r === 5) cell.style.backgroundColor = '#2c3a55';
          if (scorecard && cell.style.backgroundColor === 'rgb(255, 243, 206)') cell.style.backgroundColor = '#fcf3d1';
          cell.dataset.address = addr;
          if (mergeStarts.has(addr)) [cell.rowSpan, cell.colSpan] = mergeStarts.get(addr);
          if (note) cell.title = note;
          const options = sheet.validations[addr];
          const label = name + ' ' + addr;
          if (ast?.[0] === 'HYPERLINK') {
            const [target, targetCell] = locationOf(ast[1].slice(1), name);
            const link = el('a', ast[2]);
            link.href = '#' + encodeURIComponent(target) + '!' + targetCell;
            cell.append(link);
          } else if (ast) {
            const initialBackground = cell.style.backgroundColor, initialColor = cell.style.color;
            const update = () => {
              const value = currentValue(addr);
              cell.textContent = formatted(value, fmt);
              if (scorecard && r >= 6 && (c === 18 || c === 21) && typeof value === 'string') {
                const status = value.split(' ', 1)[0].toLowerCase();
                if ((c === 18 && ['low', 'moderate', 'high', 'critical'].includes(status)) ||
                    (c === 21 && ['hold', 'stop'].includes(status))) {
                  const badge = el('span', cell.textContent);
                  badge.className = 'risk-result ' + status;
                  cell.replaceChildren(badge);
                }
              }
              cell.style.textAlign = cell.style.textAlign || (isNumber(value) ? 'right' : '');
              const rule = conditional.find(([area, type, match]) => area.has(addr) &&
                (type === 'cellIs' ? value === match : String(value).includes(match)));
              cell.style.backgroundColor = rule?.[3] || initialBackground;
              cell.style.color = rule?.[4] || initialColor;
            };
            update();
            updates.push(update);
          } else if (Array.isArray(options)) {
            const choice = el('div');
            choice.className = 'choice';
            const display = el('span', formatted(saved, fmt));
            display.setAttribute('aria-hidden', 'true');
            const select = el('select');
            select.setAttribute('aria-label', label);
            const entries = [null, ...options];
            if (!entries.includes(saved)) entries.push(saved);
            entries.forEach((v, i) => { const option = el('option', formatted(v, fmt)); option.value = i; select.append(option); });
            select.value = String(entries.indexOf(saved));
            select.addEventListener('change', () => {
              const value = entries[select.value];
              display.textContent = formatted(value, fmt);
              edit(entry, value);
            });
            choice.append(display, select);
            cell.append(choice);
          } else {
            const content = el('div', formatted(saved, fmt));
            if (isNumber(saved) && !cell.style.textAlign) cell.style.textAlign = 'right';
            cell.append(content);
            if (notes.has(addr)) {
              content.classList.add('note-text');
              content.style.maxWidth = Math.max(widths[c], sheetView.clientWidth - widths[0] - 12) + 'px';
              if (c < frozenX && c + cell.colSpan > frozenX) {
                content.classList.add('sticky-note');
                content.style.left = prefix(widths, c) + 'px';
              }
            }
          }
        } else if (!scorecard) cell.textContent = r || column(c);
        if (r < frozenY || c < frozenX) {
          cell.classList.add('pinned');
          if (r < frozenY) cell.style.top = prefix(heights, r) + 'px';
          if (c < frozenX && !cell.querySelector('.sticky-note')) cell.style.left = prefix(widths, c) + 'px';
          if (r < frozenY && c < frozenX) cell.classList.add('both');
          if (frozenY > 1 && r === frozenY - 1) cell.classList.add('freeze-bottom');
        }
        row.append(cell);
      }
    }
    sheetView.replaceChildren(table);
    let top = 0;
    for (const row of table.rows) {
      const r = row.rowIndex + (scorecard ? 1 : 0);
      if (r >= frozenY) break;
      for (const cell of row.cells) {
        if (cell.classList.contains('pinned')) cell.style.top = top + 'px';
      }
      top += row.getBoundingClientRect().height;
    }
    divider.hidden = false;
    divider.style.left = prefix(widths, frozenX) + 'px';
    divider.style.height = sheetView.clientHeight + 'px';
    [sheetView.scrollLeft, sheetView.scrollTop] = positions.get(name) || [0, 0];
    if (destination) {
      const cell = table.querySelector('[data-address="' + destination + '"]');
      if (cell) {
        cell.tabIndex = -1;
        cell.style.scrollMarginTop = top + 'px';
        cell.style.scrollMarginLeft = prefix(widths, frozenX) + 'px';
        cell.scrollIntoView({block: 'nearest', inline: 'nearest'});
        cell.focus({preventScroll: true});
      }
    }
  }
  function navigate() {
    const [encoded, addr] = window.location.hash.slice(1).split('!');
    let name;
    try { name = decodeURIComponent(encoded); } catch { name = book.active; }
    show(Object.hasOwn(book.sheets, name) ? name : book.active, /^[A-Z]+\d+$/.test(addr || '') ? addr : null);
  }
  for (const name of Object.keys(book.sheets)) {
    const button = el('button', name);
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.addEventListener('click', () => {
      if (location.hash === '#' + encodeURIComponent(name)) show(name);
      else location.hash = encodeURIComponent(name);
    });
    tabs.set(name, button);
    nav.append(button);
  }
  window.addEventListener('hashchange', navigate);
  window.addEventListener('resize', () => show(current));
  navigate();
}
if (typeof document !== 'undefined') {
  unpack(document.querySelector('#workbook').textContent).then(launch).catch(error => {
    document.querySelector('#sheet').textContent = 'Could not load the scorecard.';
    console.error(error);
  });
}
</script>
</html>
