<script>
'use strict';
const index = letters => [...letters].reduce((sum, letter) => sum * 26 + letter.charCodeAt(0) - 64, 0);
function column(n) {
  return n ? column(Math.floor((n - 1) / 26)) + String.fromCharCode(65 + (n - 1) % 26) : '';
}
function range(ref) {
  const [start, end = start] = ref.split(':');
  const [, a, r] = /^([A-Z]+)(\d+)$/.exec(start);
  const [, b, s] = /^([A-Z]+)(\d+)$/.exec(end);
  return Array.from({length: +s - +r + 1}, (_, y) =>
    Array.from({length: index(b) - index(a) + 1}, (_, x) => column(index(a) + x) + (+r + y)));
}
function locationOf(ref, current) {
  if (!ref.includes('!')) return [current, ref];
  const [sheet, cell] = ref.split('!');
  return [sheet.replace(/^'|'$/g, '').replaceAll("''", "'"), cell];
}
const serial = value => Date.parse(value + 'T00:00:00Z') / 86400000 + 25569;
function same(a, b) {

  if (typeof b === 'string') b = b.toLowerCase();
  return a === b;
}
const isNumber = value => typeof value === 'number';
const flatten = values => values.flat(Infinity);
function calculate(workbook) {
  const memo = new Map(), pending = new Set();
  function read(sheet, addr) {
    const cell = workbook.sheets[sheet]?.cells[addr];
    if (!cell) return null;
    if (!cell[2]) return cell[0];
    const key = sheet + '!' + addr;
    if (memo.has(key)) return memo.get(key);
    if (pending.has(key)) throw Error('#CIRC!');
    pending.add(key);
    try {
      const value = evaluate(cell[2], sheet);
      memo.set(key, value);
      return value;
    } finally {
      pending.delete(key);
    }
  }
  function evaluate(node, sheet) {
    if (!Array.isArray(node)) return node;
    const [op, ...args] = node;
    const arg = n => evaluate(args[n], sheet);
    if (op === 'ref') {
      const [name, addr] = locationOf(args[0], sheet);
      if (addr.includes(':')) return range(addr).map(row => row.map(cell => read(name, cell)));
      return read(name, addr);
    }
    if (op === 'IF') return arg(0) ? arg(1) : arg(2);
    if (op === 'IFERROR') {
      try { return arg(0); } catch { return arg(1); }
    }
    if (op === 'HYPERLINK') return arg(1);
    const values = args.map((_, i) => arg(i));
    const [a, b, c] = values;
    const all = flatten(values);
    switch (op) {
      case '=': return same(a, b);
      case '<>': return !same(a, b);
      case '<': return (a ?? 0) < (b ?? 0);
      case '>': return (a ?? 0) > (b ?? 0);
      case '<=': return (a ?? 0) <= (b ?? 0);
      case '+': return Number(a) + Number(b);
      case '-': return Number(a) - Number(b);
      case '/': if (!b) throw Error('#DIV/0!'); return a / b;
      case 'ABS': return Math.abs(a);
      case 'MOD': return ((a % b) + b) % b;
      case 'NOT': return !a;
      case 'ISNUMBER': return isNumber(a);
      case 'OR': return all.some(Boolean);
      case 'AND': return all.every(Boolean);
      case 'COUNT': return all.filter(isNumber).length;
      case 'COUNTA': return all.filter(v => v !== null).length;
      case 'COUNTIF': return flatten([a]).filter(v => same(v, b)).length;
      case 'SUM': return all.filter(isNumber).reduce((sum, v) => sum + v, 0);
      case 'SUMPRODUCT': return a.flat().reduce((sum, v, i) => sum + (Number(v) || 0) * (Number(b.flat()[i]) || 0), 0);
      case 'MAX': return Math.max(0, ...all.filter(isNumber));

        const list = b.flat();
        const i = c === 0 ? list.findIndex(v => same(v, a)) : list.findLastIndex(v => isNumber(v) && v <= a);

      }
      case 'INDEX':

}
async function unpack(encoded) {

}
function formatted(value, fmt) {

  if (!isNumber(value)) return String(value);
  if (fmt === '0%') return (value * 100).toFixed(0) + '%';
  if (fmt === '0.0%') return (value * 100).toFixed(1) + '%';
  if (fmt === '0.00') return value.toFixed(2);
  if (fmt === '0') return value.toFixed(0);

    return node;

              }
              if (typeof value === 'number' && !Number.isFinite(value)) value = raw;

                return;
              }
              edit(entry, value);
              content.textContent = formatted(value, fmt);
            });
            cell.append(content);

          cell.classList.add('pinned');
          if (r < frozenY) cell.style.top = prefix(heights, r) + 'px';
          if (c < frozenX) cell.style.left = prefix(widths, c) + 'px';
          if (r < frozenY && c < frozenX) cell.classList.add('both');

        row.append(cell);

    [sheetView.scrollLeft, sheetView.scrollTop] = positions.get(name) || [0, 0];

      const cell = table.querySelector('[data-address="' + destination + '"]');

    document.querySelector('#sheet').textContent = 'Could not load the scorecard.';
    console.error(error);
  });
}
