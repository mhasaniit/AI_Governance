<title>Forge AI Risk Scorecard</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: white; color: #111; font: 14px/1.25 Arial, sans-serif }
  main { position: relative; display: grid; grid-template-rows: minmax(0,1fr) auto; height: 100dvh }
  #sheet, nav { overflow: auto }
  #sheet { scrollbar-gutter: stable }
  #pane-divider { position: absolute; z-index: 10; top: 0; width: 11px; margin-left: -5px;
    cursor: move; touch-action: none; background: linear-gradient(90deg, transparent 4px, #c7c7c7 4px 7px, transparent 7px) }
  #pane-divider:hover, #pane-divider:focus-visible, #pane-divider.dragging {
    background: linear-gradient(90deg, transparent 4px, #217346 4px 7px, transparent 7px) }
  nav { display: flex; background: #f3f3f3; border-top: 1px solid #bbb; padding: 4px 8px; gap: 3px }
  button { white-space: nowrap; padding: 6px 12px; border: 1px solid transparent; background: transparent; font: inherit; cursor: pointer }
  button[aria-selected=true] { border-color: #ccc; border-bottom: 2px solid #217346; background: white; font-weight: bold }
  table { table-layout: fixed; border-spacing: 0; empty-cells: show }
  th, td { padding: 2px 4px; overflow-wrap: anywhere; background: white }
  th { background: #f3f3f3; color: #444; font-weight: normal; border: 1px solid #ddd }
  td { white-space: pre-wrap; vertical-align: bottom }
  .grid td { border-right: 1px solid #ddd; border-bottom: 1px solid #ddd }
  .pinned { position: sticky; z-index: 2 }
  .pinned.both { z-index: 3 }
  .freeze-bottom { box-shadow: inset 0 -3px #c2c2c2 }
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere }
  .sticky-note { position: sticky }
  .scorecard td { padding: 1px 2px }
  .scorecard th { border: 0; background: #fafafa }
  .scorecard tr:first-child td, .scorecard tr:first-child th { padding: 0; }
  .scorecard tr:first-child div { min-height: 0 }
  a { color: inherit }
  td:focus-within, td:target { outline: 2px solid #217346; outline-offset: -2px }
  .choice { position: relative; width: 100%; padding-right: 13px }
  .choice::after { content: '▾'; position: absolute; right: 3px; top: 50%; transform: translateY(-50%); color: #806a16; pointer-events: none }
  .choice select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer }
</style>

          cell.style.cssText = book.styles[style];
          if (scorecard && r === 5) cell.style.backgroundColor = '#2c3a55';
          if (scorecard && cell.style.backgroundColor === 'rgb(255, 243, 206)') cell.style.backgroundColor = '#fcf3d1';
          cell.dataset.address = addr;
          if (mergeStarts.has(addr)) [cell.rowSpan, cell.colSpan] = mergeStarts.get(addr);
          if (note) cell.title = note;
          const options = sheet.validations[addr];
          const label = name + ' ' + addr;
          if (ast?.[0] === 'HYPERLINK') {
            const [target, targetCell] = locationOf(ast[1].slice(1), name);
            const link = el('a', ast[2]);
            link.href = '#' + encodeURIComponent(target) + '!' + targetCell;
            cell.append(link);
          } else if (ast) {
            const initialBackground = cell.style.backgroundColor, initialColor = cell.style.color;
            const update = () => {
              const value = currentValue(addr);
              cell.textContent = formatted(value, fmt);
              cell.style.textAlign = cell.style.textAlign || (isNumber(value) ? 'right' : '');
              const rule = conditional.find(([area, type, match]) => area.has(addr) &&
                (type === 'cellIs' ? value === match : String(value).includes(match)));
              cell.style.backgroundColor = rule?.[3] || initialBackground;
              cell.style.color = rule?.[4] || initialColor;
            };
            update();
            updates.push(update);
          } else if (Array.isArray(options)) {
            const choice = el('div');
            choice.className = 'choice';
            const display = el('span', formatted(saved, fmt));
            display.setAttribute('aria-hidden', 'true');
            const select = el('select');
            select.setAttribute('aria-label', label);
            const entries = [null, ...options];
            if (!entries.includes(saved)) entries.push(saved);
            entries.forEach((v, i) => { const option = el('option', formatted(v, fmt)); option.value = i; select.append(option); });
            select.value = String(entries.indexOf(saved));
            select.addEventListener('change', () => {
              const value = entries[select.value];
              display.textContent = formatted(value, fmt);
              edit(entry, value);
            });
            choice.append(display, select);
            cell.append(choice);
          } else {
            const content = el('div', formatted(saved, fmt));
            if (isNumber(saved) && !cell.style.textAlign) cell.style.textAlign = 'right';
            cell.append(content);
            if (notes.has(addr)) {
              content.classList.add('note-text');
              content.style.maxWidth = Math.max(widths[c], sheetView.clientWidth - widths[0] - 12) + 'px';
              if (c < frozenX && c + cell.colSpan > frozenX) {
                content.classList.add('sticky-note');
                content.style.left = prefix(widths, c) + 'px';
              }
            }
          }
        } else if (!scorecard) cell.textContent = r || column(c);
        if (r < frozenY || c < frozenX) {
          cell.classList.add('pinned');
          if (r < frozenY) cell.style.top = prefix(heights, r) + 'px';
          if (c < frozenX && !cell.querySelector('.sticky-note')) cell.style.left = prefix(widths, c) + 'px';
          if (r < frozenY && c < frozenX) cell.classList.add('both');
          if (frozenY > 1 && r === frozenY - 1) cell.classList.add('freeze-bottom');
        }
        row.append(cell);
      }
    }
    sheetView.replaceChildren(table);
    let top = 0;
    for (const row of table.rows) {
      const r = row.rowIndex + (scorecard ? 1 : 0);
      if (r >= frozenY) break;
      for (const cell of row.cells) {
        if (cell.classList.contains('pinned')) cell.style.top = top + 'px';
      }
      top += row.getBoundingClientRect().height;
    }
    divider.hidden = false;
    divider.style.left = prefix(widths, frozenX) + 'px';
    divider.style.height = sheetView.clientHeight + 'px';
    [sheetView.scrollLeft, sheetView.scrollTop] = positions.get(name) || [0, 0];
    if (destination) {
      const cell = table.querySelector('[data-address="' + destination + '"]');
      if (cell) {
        cell.tabIndex = -1;
        cell.style.scrollMarginTop = top + 'px';
        cell.style.scrollMarginLeft = prefix(widths, frozenX) + 'px';
        cell.scrollIntoView({block: 'nearest', inline: 'nearest'});
        cell.focus({preventScroll: true});
      }
    }
  }
  function navigate() {
    const [encoded, addr] = window.location.hash.slice(1).split('!');
    let name;
    try { name = decodeURIComponent(encoded); } catch { name = book.active; }
    show(Object.hasOwn(book.sheets, name) ? name : book.active, /^[A-Z]+\d+$/.test(addr || '') ? addr : null);
  }
  for (const name of Object.keys(book.sheets)) {
    const button = el('button', name);
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.addEventListener('click', () => {
      if (location.hash === '#' + encodeURIComponent(name)) show(name);
      else location.hash = encodeURIComponent(name);
    });
    tabs.set(name, button);
    nav.append(button);
  }
  window.addEventListener('hashchange', navigate);
  window.addEventListener('resize', () => show(current));
  navigate();
}
if (typeof document !== 'undefined') {
  unpack(document.querySelector('#workbook').textContent).then(launch).catch(error => {
    document.querySelector('#sheet').textContent = 'Could not load the scorecard.';
    console.error(error);
  });
}
</script>
</html>
